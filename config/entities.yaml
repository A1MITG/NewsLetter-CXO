# PRD §5 — Entity Extraction.
#
# Gazetteer-driven, deliberately. Entity extraction is the one enrichment
# stage where a deterministic list beats a model on the axis that matters
# here: it is auditable. Every extraction points at a term in this file, so
# a wrong entity is a config bug you can see and fix, not a hallucination
# you have to detect.
#
# Precision over recall. A missed entity costs a little ranking signal; a
# fabricated one ("Stock" as a company, from a person's surname) is the class
# of defect this whole pipeline exists to eliminate.
#
# Extend freely — this file is the intended place to grow coverage.

