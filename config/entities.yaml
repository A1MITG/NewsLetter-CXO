# Role terms used to detect executives. A capitalised name is only recorded
# as a person when it sits adjacent to one of these — a bare capitalised
# token is never assumed to be a person.
executive_roles:
  - chief executive officer
  - chief executive
  - chief financial officer
  - chief operating officer
  - chief information officer
  - chief technology officer
  - chief risk officer
  - managing director
  - CEO
  - CFO
  - COO
  - CIO
  - CTO
  - CRO
  - chairman
  - chairwoman
  - president
  - founder
  - co-founder

# Never treated as a person even when adjacent to a role term.
person_stoplist:
  - The
  - A
  - An
  - This
  - That
  - New
  - Former
  - Ex
  - Group
  - Company
  - Board
  - Its
  - His
  - Her
  - Their
