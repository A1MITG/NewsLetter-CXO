# People Movers pins, read by app/analysis/command_center.py:load_pinned_moves.
#
# A pin keeps a reported move at the front of the People Movers row past the
# row's usual 7-day window, until its `until` date (IST, inclusive), then it
# drops off by itself. The card shows the report's real date and a "Pinned"
# label, so an older story never passes as today's news.
#
# Pin only moves a publication has actually reported, and link that report.
#
#   title      the report's headline, as published
#   url        the report itself
#   source     the publisher's name as it should be credited
#   published  the report's publication date (YYYY-MM-DD)
#   type       Appointed | Steps down | Leadership change
#   until      last day the pin is shown (YYYY-MM-DD)

pins:
  - title: "Ex-HSBC HR leader Dimple Kaloya joins MetLife GCC as CHRO"
    url: "https://www.peoplematters.in/news/appointments/ex-hsbc-hr-leader-dimple-kaloya-joins-metlife-gcc-as-chro-51515"
    source: "People Matters"
    published: 2026-08-18
    type: Appointed
    until: 2026-10-24   # pinned 2026-09-24 for one month
