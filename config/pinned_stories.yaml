# Engine tile pins, read by app/analysis/command_center.py:load_pinned_stories.
#
# A pin keeps a published story at the front of one engine tile after the
# feeds stop listing it, until its `until` date (IST, inclusive), then it
# drops off by itself. Each build sees only what the feeds list at that
# moment, so without a pin a story can vanish within a day of publication.
# With `featured: true` the story is also the Featured Analysis card, which
# says "Pinned" and shows the story's real date.
#
# Pin only a story a publication has actually run, and link it.
#
#   title      the story's headline, as published
#   url        the story itself
#   source     the publisher's name as it should be credited
#   published  the story's publication date (YYYY-MM-DD)
#   engine     the tile it leads: gcc, insurance, global, ai, economy, ...
#   summary    the publisher's own description (optional)
#   image      the story's picture, an absolute URL (optional)
#   featured   true to make it the Featured Analysis card too (optional)
#   until      last day the pin is shown (YYYY-MM-DD)

pins:
  - title: "Nearly 70% of India's GCCs stuck at AI pilot stage: Dell-Zinnov report"
    url: "https://economictimes.indiatimes.com/tech/technology/nearly-70-of-indias-gccs-stuck-at-ai-pilot-stage-dell-zinnov-report/articleshow/134432876.cms"
    source: "The Economic Times"
    published: 2026-09-23
    engine: gcc
    summary: "The report, titled 'India GCCs 2030: From Capability Centers to Agentic Transformation Engines', noted that while ambition remains high, approximately 55% of routine GCC work is currently exposed to AI-led automation, necessitating that nearly 60% of the workforce undergo reskilling by 2030."
    image: "https://img.etimg.com/photo/msid-134432876,imgsize-109716.cms"
    featured: true
    until: 2026-10-02   # pinned 2026-09-25 for a week (first through Sunday 27 Sep)
