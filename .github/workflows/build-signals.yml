name: Build Signals (static)

# Regenerates public/ — the static Signals page Vercel serves — once a day,
# or on demand via the "Run workflow" button. Pushing the result to the
# connected branch is what triggers Vercel's automatic redeploy; no Vercel
# token or deploy hook is needed here.

on:
  schedule:
    - cron: "30 2 * * *"  # 08:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static Signals page
        run: python scripts/build_static_signals.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || git commit -m "Daily Signals rebuild: $(date -u +'%Y-%m-%d')"
          git push
