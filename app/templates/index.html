<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL — The Daily Brief</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="masthead">
        <p class="kicker">Signal &middot; Daily Intelligence</p>
        <h1>The Daily Brief</h1>
        <p class="dateline"><span id="brief-date"></span><span id="last-updated"></span></p>
        <p class="viewnav"><a href="/signals">Signals view &rarr;</a></p>
    </header>

    <main id="newsletter-content">
        <p class="loading">Preparing today's brief&hellip;</p>
    </main>

    <footer>
        <p>Confidential &middot; For Executive Leadership Only</p>
    </footer>

    <script>
        const SECTIONS = [
            'Macro & Geo-Political',
            'Regulatory & Compliance',
            'Economic & Market',
            'Digital, AI & Automation',
            'Operating Model & Talent'
        ];

        function renderBrief(data) {
            const content = document.getElementById('newsletter-content');
            document.getElementById('brief-date').textContent = data.date || '';
            document.getElementById('last-updated').textContent =
                ' · Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let html = '';

            if (data.executive_takeaway) {
                html += `<section class="lead"><p>${data.executive_takeaway}</p></section>`;
            }

            let hasSignals = false;
            SECTIONS.forEach(section => {
                const items = (data[section] || []).filter(a => a.url);
                if (items.length === 0) return;
                hasSignals = true;
                const cxo = items[0].primary_cxo || '';
                html += `<section class="lens">
                    <h2><span>${section}</span><span class="tag">${cxo}</span></h2>
                    ${items.map(a => `
                        <article>
                            <h3><a href="${a.url}" target="_blank" rel="noopener">${a.signal}</a></h3>
                        </article>`).join('')}
                </section>`;
            });

            if (!hasSignals) {
                html += `<section class="lens"><p class="quiet">No material CXO-level signals in the last 24 hours.</p></section>`;
            }

            if (data.cxo_action_lens && data.cxo_action_lens.length > 0) {
                html += `<section class="lens actions">
                    <h2>The Action Lens</h2>
                    ${data.cxo_action_lens.map(action => {
                        const i = action.indexOf(':');
                        const verb = i > 0 ? action.slice(0, i) : '';
                        const rest = i > 0 ? action.slice(i + 1).trim() : action;
                        return `<article class="action"><span class="verb">${verb}</span><p>${rest}</p></article>`;
                    }).join('')}
                </section>`;
            }

            content.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/newsletter')
                .then(response => response.json())
                .then(renderBrief)
                .catch(error => {
                    console.error('Error fetching newsletter:', error);
                    document.getElementById('newsletter-content').innerHTML =
                        '<p class="error">The brief could not be loaded.</p>';
                });
        });
    </script>
</body>
</html>
